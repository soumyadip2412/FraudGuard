# docker compose up -d --build   ->  app at http://127.0.0.1:8080 (API docs at /api/docs)
# docker compose up -d db        ->  only PostgreSQL, for running uvicorn/npm locally
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fraudguard
      POSTGRES_USER: fraudguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudguard}
    ports:
      - "127.0.0.1:5432:5432" # localhost only, never exposed to the network
    volumes:
      - pgdata:/var/lib/postgresql/data # data survives container restarts/rebuilds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudguard -d fraudguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://fraudguard:${POSTGRES_PASSWORD:-fraudguard}@db:5432/fraudguard
      API_KEY: ${API_KEY:-}
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro
    depends_on:
      db:
        condition: service_healthy # migrations run at startup, so the DB must accept connections
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:

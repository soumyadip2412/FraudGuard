server {
    listen 80;
    root /usr/share/nginx/html;

    # A batch of 1000 transactions is ~600 KB of JSON; allow some headroom.
    client_max_body_size 5m;

    # Docker's internal DNS. With the upstream in a variable, nginx re-resolves "api"
    # as needed instead of caching its IP at startup, so a recreated API container
    # (which may get a new IP) doesn't leave every request failing with 502.
    resolver 127.0.0.11 valid=10s;

    # Same origin for the app and the API, so the browser needs no CORS setup.
    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break; # FastAPI's routes have no /api prefix
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so browsers can cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
